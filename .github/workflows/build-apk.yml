name: Build Rawasi Alshahaqa APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable

      - name: Extract source
        run: |
          rm -rf app
          mkdir app
          unzip -q "rawasi_alshahaqa_v7_modern.zip" -d app

      - name: Create modern Android project
        working-directory: app
        run: |
          flutter create . \
            --platforms=android \
            --org com.rawasi \
            --project-name alshahaqa

      - name: Get dependencies
        working-directory: app
        run: flutter pub get

      - name: Build APK
        working-directory: app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rawasi-alshahaqa-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
